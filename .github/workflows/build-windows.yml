name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build (onedir)
        run: pyinstaller --noconsole --name SteamGameInfoCollector main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SteamGameInfoCollector-windows
          path: dist/SteamGameInfoCollector/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: SteamGameInfoCollector-windows
          path: SteamGameInfoCollector

      - name: Zip artifact
        run: powershell Compress-Archive -Path SteamGameInfoCollector\* -DestinationPath SteamGameInfoCollector-windows.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: SteamGameInfoCollector-windows.zip
